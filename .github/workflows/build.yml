name: Windows app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan history for secrets
        shell: pwsh
        run: ./.github/scripts/check-secrets.ps1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked development dependencies
        run: npm ci
      - name: Check source syntax
        run: npm run check
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Test imports and storage
        run: npm test
      - name: Test desktop workflows
        run: npm run test:app
      - name: Build offline installer
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Save installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Quiznet-Windows
          path: dist/Quiznet-Setup.exe
          if-no-files-found: error
